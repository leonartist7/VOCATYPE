# Vocatype Backend — project config & lint rules (Ruff)
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "ASYNC", # flake8-async
]
ignore = [
    "E501", # line length enforced by ruff format, not lint
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
# Ensure the `app` package is importable when running pytest from anywhere.
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
